<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --card: #ffffff;
            --ink: #17202a;
            --muted: #657182;
            --line: #d9e0e7;
            --primary: #ef1b13;
            --blue: #2563eb;
            --green: #198754;
            --red: #dc3545;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: Arial, sans-serif;
        }

        header {
            background: #151d26;
            color: white;
            padding: 18px 24px;
        }

        header .bar {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h1,
        h2 {
            margin: 0;
        }

        h1 {
            font-size: 24px;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .back-link {
            padding: 10px 14px;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.12);
            font-weight: 700;
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(300px, 0.42fr) minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .panel-head p {
            margin: 6px 0 0;
            color: var(--muted);
            line-height: 1.45;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--ink);
            background: white;
        }

        textarea {
            min-height: 94px;
            resize: vertical;
        }

        .actions,
        .row-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            border: 0;
            border-radius: var(--radius);
            padding: 10px 13px;
            color: white;
            background: var(--blue);
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.94);
        }

        .primary {
            background: var(--primary);
        }

        .secondary {
            background: #6c757d;
        }

        .edit-btn {
            background: var(--green);
        }

        .delete-btn {
            background: var(--red);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .toolbar input {
            max-width: 360px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f8fafc;
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .row-actions button {
            padding: 8px 10px;
            font-size: 13px;
        }

        .status {
            min-height: 22px;
            color: var(--muted);
            font-weight: 700;
        }

        .status.error {
            color: var(--red);
        }

        .status.success {
            color: var(--green);
        }

        .empty {
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 860px) {
            header .bar,
            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            main {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="bar">
        <div>
            <h1>Customer Management</h1>
            <div>Full CRUD for workshop customer records</div>
        </div>
        <a class="back-link" href="index.html">Back to Dashboard</a>
    </div>
</header>

<main>
    <div class="grid">
        <section class="panel">
            <div class="panel-head">
                <div>
                    <h2 id="formTitle">Add Customer</h2>
                    <p>Create or update customer contact details.</p>
                </div>
            </div>

            <form id="customerForm">
                <input id="customerId" type="hidden">

                <label>
                    Customer Name
                    <input id="customerName" type="text" placeholder="Customer name" required>
                </label>

                <label>
                    Contact Number
                    <input id="contactNumber" type="tel" placeholder="Contact number" required>
                </label>

                <label>
                    Email
                    <input id="email" type="email" placeholder="Email address" required>
                </label>

                <label>
                    Address
                    <textarea id="address" placeholder="Customer address" required></textarea>
                </label>

                <div class="actions">
                    <button id="submitBtn" class="primary" type="submit">Add Customer</button>
                    <button class="secondary" type="button" onclick="resetForm()">Clear</button>
                </div>

                <div id="formStatus" class="status"></div>
            </form>
        </section>

        <section class="panel">
            <div class="panel-head">
                <div>
                    <h2>Customers</h2>
                    <p>View, search, edit, and delete customer records.</p>
                </div>
            </div>

            <div class="toolbar">
                <input id="searchInput" type="search" placeholder="Search name, contact, email, or address">
                <button type="button" onclick="loadCustomers()">Refresh</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer Name</th>
                        <th>Contact Number</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="customerTable">
                    <tr>
                        <td colspan="6" class="empty">Loading customers...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<script>
    const apiUrl = "http://localhost:8080/api/customers";
    const form = document.getElementById("customerForm");
    const table = document.getElementById("customerTable");
    const searchInput = document.getElementById("searchInput");
    const formStatus = document.getElementById("formStatus");
    let customers = [];

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const id = document.getElementById("customerId").value;
        const customer = {
            customerName: value("customerName"),
            contactNumber: value("contactNumber"),
            email: value("email"),
            address: value("address")
        };

        const url = id ? `${apiUrl}/${id}` : apiUrl;
        const method = id ? "PUT" : "POST";

        try {
            const response = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(customer)
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            setStatus(id ? "Customer updated successfully." : "Customer added successfully.", "success");
            resetForm();
            await loadCustomers();
        } catch (error) {
            setStatus(cleanError(error.message || "Failed to save customer."), "error");
        }
    });

    searchInput.addEventListener("input", renderCustomers);

    async function loadCustomers() {
        try {
            const response = await fetch(apiUrl);

            if (!response.ok) {
                throw new Error(await response.text());
            }

            customers = await response.json();
            renderCustomers();
        } catch (error) {
            table.innerHTML = `<tr><td colspan="6" class="empty">${safe(cleanError(error.message || "Failed to load customers."))}</td></tr>`;
        }
    }

    function renderCustomers() {
        const keyword = searchInput.value.trim().toLowerCase();
        const filtered = customers.filter((customer) => {
            const text = [
                customer.id,
                customer.customerName || customer.fullName,
                customer.contactNumber || customer.phoneNumber,
                customer.email,
                customer.address
            ].join(" ").toLowerCase();
            return text.includes(keyword);
        });

        if (!filtered.length) {
            table.innerHTML = `<tr><td colspan="6" class="empty">No customers found.</td></tr>`;
            return;
        }

        table.innerHTML = filtered.map((customer) => `
            <tr>
                <td>${safe(customer.id)}</td>
                <td>${safe(customer.customerName || customer.fullName || "-")}</td>
                <td>${safe(customer.contactNumber || customer.phoneNumber || "-")}</td>
                <td>${safe(customer.email || "-")}</td>
                <td>${safe(customer.address || "-")}</td>
                <td>
                    <div class="row-actions">
                        <button class="edit-btn" type="button" onclick="editCustomer(${Number(customer.id)})">Edit</button>
                        <button class="delete-btn" type="button" onclick="deleteCustomer(${Number(customer.id)})">Delete</button>
                    </div>
                </td>
            </tr>
        `).join("");
    }

    function editCustomer(id) {
        const customer = customers.find((item) => Number(item.id) === Number(id));

        if (!customer) {
            setStatus("Customer not found.", "error");
            return;
        }

        document.getElementById("customerId").value = customer.id;
        document.getElementById("customerName").value = customer.customerName || customer.fullName || "";
        document.getElementById("contactNumber").value = customer.contactNumber || customer.phoneNumber || "";
        document.getElementById("email").value = customer.email || "";
        document.getElementById("address").value = customer.address || "";
        document.getElementById("formTitle").textContent = "Update Customer";
        document.getElementById("submitBtn").textContent = "Update Customer";
        setStatus("Editing selected customer.", "");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteCustomer(id) {
        if (!confirm("Are you sure you want to delete this customer?")) {
            return;
        }

        try {
            const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            setStatus("Customer deleted successfully.", "success");
            resetForm();
            await loadCustomers();
        } catch (error) {
            setStatus(cleanError(error.message || "Failed to delete customer."), "error");
        }
    }

    function resetForm() {
        form.reset();
        document.getElementById("customerId").value = "";
        document.getElementById("formTitle").textContent = "Add Customer";
        document.getElementById("submitBtn").textContent = "Add Customer";
    }

    function value(id) {
        return document.getElementById(id).value.trim();
    }

    function setStatus(message, type) {
        formStatus.textContent = message;
        formStatus.className = `status ${type || ""}`;
    }

    function cleanError(message) {
        return String(message).replace(/^.*"message":"?/, "").replace(/".*$/, "") || "Request failed.";
    }

    function safe(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    loadCustomers();
</script>
</body>
</html>
