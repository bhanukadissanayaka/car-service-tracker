<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoice Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        input, select, button {
            padding: 12px;
            font-size: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #084298;
        }

        .full-width {
            grid-column: span 2;
        }

        .reset-btn {
            background: #6c757d;
        }

        .reset-btn:hover {
            background: #495057;
        }

        .edit-btn {
            background: #198754;
            padding: 8px 12px;
        }

        .edit-btn:hover {
            background: #0f5132;
        }

        .delete-btn {
            background: #dc3545;
            padding: 8px 12px;
        }

        .delete-btn:hover {
            background: #a71d2a;
        }

        .print-btn {
            background: #fd7e14;
            padding: 8px 12px;
        }

        .print-btn:hover {
            background: #b45309;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #222;
            color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .actions {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .status-paid {
            color: green;
            font-weight: bold;
        }

        .status-pending {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Invoice / Billing Management</h1>

    <form id="invoiceForm">
        <input type="hidden" id="invoiceId">

        <input type="text" id="customerName" placeholder="Customer Name" required>
        <input type="text" id="vehicleNumber" placeholder="Vehicle Number" required>

        <input type="text" id="serviceType" placeholder="Service Type" required>
        <input type="date" id="invoiceDate" required>

        <input type="number" id="laborCost" placeholder="Labor Cost" required>
        <input type="number" id="partsCost" placeholder="Parts Cost" required>

        <input type="number" id="discount" placeholder="Discount" required>

        <select id="paymentStatus" required>
            <option value="">Select Payment Status</option>
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
        </select>

        <button type="submit" id="submitBtn">Add Invoice</button>
        <button type="button" class="reset-btn" onclick="resetForm()">Clear Form</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Vehicle</th>
            <th>Service</th>
            <th>Date</th>
            <th>Labor</th>
            <th>Parts</th>
            <th>Discount</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody id="invoiceTableBody">
        </tbody>
    </table>
</div>

<script>
    const apiUrl = "http://localhost:8081/api/invoices";

    document.getElementById("invoiceForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const invoiceId = document.getElementById("invoiceId").value;

        const invoice = {
            customerName: document.getElementById("customerName").value,
            vehicleNumber: document.getElementById("vehicleNumber").value,
            serviceType: document.getElementById("serviceType").value,
            invoiceDate: document.getElementById("invoiceDate").value,
            laborCost: parseFloat(document.getElementById("laborCost").value),
            partsCost: parseFloat(document.getElementById("partsCost").value),
            discount: parseFloat(document.getElementById("discount").value),
            paymentStatus: document.getElementById("paymentStatus").value
        };

        if (invoiceId === "") {
            addInvoice(invoice);
        } else {
            updateInvoice(invoiceId, invoice);
        }
    });

    function addInvoice(invoice) {
        fetch(apiUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(invoice)
        })
            .then(response => response.json())
            .then(data => {
                alert("Invoice added successfully!");
                resetForm();
                loadInvoices();
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to add invoice");
            });
    }

    function updateInvoice(id, invoice) {
        fetch(`${apiUrl}/${id}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(invoice)
        })
            .then(response => response.json())
            .then(data => {
                alert("Invoice updated successfully!");
                resetForm();
                loadInvoices();
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to update invoice");
            });
    }

    function loadInvoices() {
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById("invoiceTableBody");
                tableBody.innerHTML = "";

                data.forEach(invoice => {
                    const statusClass = invoice.paymentStatus === "Paid" ? "status-paid" : "status-pending";

                    const row = `
                        <tr>
                            <td>${invoice.invoiceId}</td>
                            <td>${invoice.customerName}</td>
                            <td>${invoice.vehicleNumber}</td>
                            <td>${invoice.serviceType}</td>
                            <td>${invoice.invoiceDate}</td>
                            <td>${invoice.laborCost}</td>
                            <td>${invoice.partsCost}</td>
                            <td>${invoice.discount}</td>
                            <td><strong>${invoice.totalAmount}</strong></td>
                            <td class="${statusClass}">${invoice.paymentStatus}</td>
                            <td>
                                <div class="actions">
                                    <button class="edit-btn" onclick="editInvoice(${invoice.invoiceId})">Edit</button>
                                    <button class="delete-btn" onclick="deleteInvoice(${invoice.invoiceId})">Delete</button>
                                    <button class="print-btn" onclick="printInvoice(${invoice.invoiceId})">Print</button>
                                </div>
                            </td>
                        </tr>
                    `;

                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to load invoices");
            });
    }

    function editInvoice(id) {
        fetch(`${apiUrl}/${id}`)
            .then(response => response.json())
            .then(invoice => {
                document.getElementById("invoiceId").value = invoice.invoiceId;
                document.getElementById("customerName").value = invoice.customerName;
                document.getElementById("vehicleNumber").value = invoice.vehicleNumber;
                document.getElementById("serviceType").value = invoice.serviceType;
                document.getElementById("invoiceDate").value = invoice.invoiceDate;
                document.getElementById("laborCost").value = invoice.laborCost;
                document.getElementById("partsCost").value = invoice.partsCost;
                document.getElementById("discount").value = invoice.discount;
                document.getElementById("paymentStatus").value = invoice.paymentStatus;

                document.getElementById("submitBtn").innerText = "Update Invoice";
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to load selected invoice");
            });
    }

    function deleteInvoice(id) {
        const confirmDelete = confirm("Are you sure you want to delete this invoice?");

        if (!confirmDelete) {
            return;
        }

        fetch(`${apiUrl}/${id}`, {
            method: "DELETE"
        })
            .then(response => response.text())
            .then(data => {
                alert(data);
                loadInvoices();
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to delete invoice");
            });
    }

    function printInvoice(id) {
        fetch(`${apiUrl}/${id}`)
            .then(response => response.json())
            .then(invoice => {
                const printWindow = window.open("", "_blank");

                printWindow.document.write(`
                    <html>
                    <head>
                        <title>Invoice</title>
                        <style>
                            body {
                                font-family: Arial, sans-serif;
                                padding: 30px;
                            }

                            h1 {
                                text-align: center;
                            }

                            table {
                                width: 100%;
                                border-collapse: collapse;
                                margin-top: 20px;
                            }

                            td, th {
                                border: 1px solid #333;
                                padding: 10px;
                            }

                            .total {
                                font-size: 20px;
                                font-weight: bold;
                            }
                        </style>
                    </head>
                    <body>
                        <h1>Car Service Tracker Invoice</h1>

                        <p><strong>Invoice ID:</strong> ${invoice.invoiceId}</p>
                        <p><strong>Customer Name:</strong> ${invoice.customerName}</p>
                        <p><strong>Vehicle Number:</strong> ${invoice.vehicleNumber}</p>
                        <p><strong>Service Type:</strong> ${invoice.serviceType}</p>
                        <p><strong>Invoice Date:</strong> ${invoice.invoiceDate}</p>

                        <table>
                            <tr>
                                <th>Description</th>
                                <th>Amount</th>
                            </tr>
                            <tr>
                                <td>Labor Cost</td>
                                <td>${invoice.laborCost}</td>
                            </tr>
                            <tr>
                                <td>Parts Cost</td>
                                <td>${invoice.partsCost}</td>
                            </tr>
                            <tr>
                                <td>Discount</td>
                                <td>${invoice.discount}</td>
                            </tr>
                            <tr>
                                <td class="total">Total Amount</td>
                                <td class="total">${invoice.totalAmount}</td>
                            </tr>
                        </table>

                        <p><strong>Payment Status:</strong> ${invoice.paymentStatus}</p>
                    </body>
                    </html>
                `);

                printWindow.document.close();
                printWindow.print();
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to print invoice");
            });
    }

    function resetForm() {
        document.getElementById("invoiceForm").reset();
        document.getElementById("invoiceId").value = "";
        document.getElementById("submitBtn").innerText = "Add Invoice";
    }

    loadInvoices();
</script>

</body>
</html>
