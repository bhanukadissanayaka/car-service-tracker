<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Records - ServiceHub</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --edit: #3b82f6;
            --edit-hover: #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e0f2fe 100%);
            min-height: 100vh;
            color: #1e293b;
        }

        .container { max-width: 1300px; margin: 20px auto; padding: 20px; }

        header {
            background: white;
            border-radius: 16px;
            padding: 20px 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Aligns header content smoothly */
            gap: 20px;
            margin-bottom: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
        }

        header h1 {
            font-size: 22px;
            color: #475569;
            font-weight: 600;
        }

        .main-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .toolbar {
            padding: 20px 28px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto; /* Prevents layout breaking on small screens */
        }

        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: var(--primary); color: white; padding: 16px; text-align: left; font-weight: 600; }
        td { padding: 16px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        tr:hover { background: #f8fafc; }

        /* Unified Button Utilities */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .btn-edit { background: #eff6ff; color: var(--edit); border: 1px solid #bfdbfe; }
        .btn-edit:hover { background: var(--edit); color: white; }
        .btn-delete { background: #fef2f2; color: var(--danger); border: 1px solid #fca5a5; }
        .btn-delete:hover { background: var(--danger); color: white; }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }
        .status-completed { background:#d1fae5; color:#065f46; }
        .status-pending { background:#fef3c7; color:#92400e; }
        .status-cancelled { background:#fee2e2; color:#991b1b; }

        /* Overlay & Modal Alignment */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto; /* Handles minor overflows safely */
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #475569; }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        .modal-buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="brand">
            <i data-lucide="car-front"></i>
            <span>ServiceHub</span>
        </div>
        <h1>Service Records Module</h1>
    </header>

    <div class="main-card">
        <div class="toolbar">
            <div class="filter-group">
                <strong>Filter by Status:</strong>
                <select id="statusFilter" onchange="filterServices()" style="width: auto;">
                    <option value="">All Records</option>
                    <option value="Completed">Completed</option>
                    <option value="Pending">Pending</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="showAddForm()">
                <i data-lucide="plus"></i> Add New Service
            </button>
        </div>

        <div class="table-responsive">
            <table id="serviceTable">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Service Type</th>
                    <th>Description</th>
                    <th>Cost (Rs)</th>
                    <th>Mileage</th>
                    <th>Next Service</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="serviceModal">
    <div class="modal-content">
        <span class="close-btn" onclick="hideModal()">✕</span>

        <h2 id="modalTitle" style="color: var(--primary); margin-bottom: 10px;">Add New Service Record</h2>

        <input type="hidden" id="serviceId">

        <label>Car ID <span style="color:red;">*</span></label>
        <input type="number" id="carId" value="1">

        <label>Service Date</label>
        <input type="date" id="serviceDate">

        <label>Service Type</label>
        <input type="text" id="serviceType" placeholder="Oil Change, Brake Repair...">

        <label>Description</label>
        <textarea id="description" rows="2" placeholder="Brief description of service"></textarea>

        <label>Cost (Rs)</label>
        <input type="number" id="cost" step="0.01">

        <label>Mileage at Service</label>
        <input type="number" id="mileageAtService">

        <label>Next Service Date</label>
        <input type="date" id="nextServiceDate">

        <label>Status</label>
        <select id="status">
            <option value="Completed">Completed</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
        </select>

        <div class="modal-buttons">
            <button class="btn" style="background:#e2e8f0; color:#475569;" onclick="hideModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveService()">Submit</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api/services";

    async function loadServices() {
        // Mocking local response structure in case of API failure for demonstration safety
        try {
            const res = await fetch(API_BASE);
            const services = await res.json();
            displayServices(services);
        } catch (err) {
            console.warn("API offline, rendering fallback placeholder row.");
            displayServices([]);
        }
    }

    function displayServices(services) {
        const tbody = document.querySelector("#serviceTable tbody");
        if (services.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #64748b; padding: 30px;">No service records found.</td></tr>`;
            return;
        }

        tbody.innerHTML = services.map(s => `
            <tr>
                <td>${s.serviceDate || '-'}</td>
                <td><strong>${s.serviceType || '-'}</strong></td>
                <td>${s.description || '-'}</td>
                <td>Rs. ${Number(s.cost || 0).toLocaleString('en-LK', {minimumFractionDigits: 2})}</td>
                <td>${s.mileageAtService ? Number(s.mileageAtService).toLocaleString() : 0} km</td>
                <td>${s.nextServiceDate || '-'}</td>
                <td><span class="status status-${(s.status || 'pending').toLowerCase()}">${s.status || 'Pending'}</span></td>
                <td>
                    <div class="actions-cell">
                        <button class="btn btn-sm btn-edit" onclick="editService(${s.id})">
                            <i data-lucide="pencil" style="width:14px;height:14px;"></i> Edit
                        </button>
                        <button class="btn btn-sm btn-delete" onclick="deleteService(${s.id})">
                            <i data-lucide="trash-2" style="width:14px;height:14px;"></i> Delete
                        </button>
                    </div>
                </td>
            </tr>
        `).join("");

        // Re-initialize Lucide icons for dynamically added table entries
        if(window.lucide) {
            lucide.createIcons();
        }
    }

    function showAddForm() {
        document.getElementById("modalTitle").textContent = "Add New Service Record";
        document.getElementById("serviceId").value = "";
        document.getElementById("serviceModal").style.display = "flex";
    }

    function hideModal() {
        document.getElementById("serviceModal").style.display = "none";
    }

    async function saveService() {
        const id = document.getElementById("serviceId").value;
        const carId = document.getElementById("carId").value;

        const data = {
            serviceDate: document.getElementById("serviceDate").value,
            serviceType: document.getElementById("serviceType").value,
            description: document.getElementById("description").value,
            cost: parseFloat(document.getElementById("cost").value) || 0,
            mileageAtService: parseInt(document.getElementById("mileageAtService").value) || 0,
            nextServiceDate: document.getElementById("nextServiceDate").value,
            status: document.getElementById("status").value
        };

        try {
            if (id) {
                await fetch(`${API_BASE}/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            } else {
                await fetch(`${API_BASE}/car/${carId}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            }
            hideModal();
            loadServices();
            alert("✅ Service Record Saved Successfully!");
        } catch(e) {
            alert("❌ Failed to save service record.");
        }
    }

    async function editService(id) {
        try {
            const res = await fetch(`${API_BASE}/${id}`);
            const s = await res.json();

            document.getElementById("modalTitle").textContent = "Edit Service Record";
            document.getElementById("serviceId").value = s.id;
            document.getElementById("carId").value = s.car ? s.car.id : 1;
            document.getElementById("serviceDate").value = s.serviceDate || "";
            document.getElementById("serviceType").value = s.serviceType || "";
            document.getElementById("description").value = s.description || "";
            document.getElementById("cost").value = s.cost || "";
            document.getElementById("mileageAtService").value = s.mileageAtService || "";
            document.getElementById("nextServiceDate").value = s.nextServiceDate || "";
            document.getElementById("status").value = s.status || "Pending";

            document.getElementById("serviceModal").style.display = "flex";
        } catch (err) {
            alert("❌ Error fetching record details.");
        }
    }

    async function deleteService(id) {
        if (confirm("Are you sure you want to delete this record?")) {
            try {
                await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                loadServices();
            } catch(e) {
                alert("❌ Error deleting record.");
            }
        }
    }

    async function filterServices() {
        const status = document.getElementById("statusFilter").value;
        let url = API_BASE;
        if (status) url += `/filter?status=${status}`;

        try {
            const res = await fetch(url);
            const services = await res.json();
            displayServices(services);
        } catch(e) {
            console.error("Filtering failed due to connection error.");
        }
    }

    window.onload = () => {
        loadServices();
        if(window.lucide) {
            lucide.createIcons();
        }
    };
</script>
</body>
</html>
